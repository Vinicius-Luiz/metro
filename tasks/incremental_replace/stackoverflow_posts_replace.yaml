table:
  schema_name: public
  name: posts
  target_schema_name: raw
  target_name: stackoverflow_posts

source:
  type: postgresql
  runtime: stackoverflow_postgres_database
  chunk_size: 50000

target:
  type: local
  runtime: development_storage
  chunk_size: 200000

replication:
  mode: incremental
  strategy:
    type: replace
    reference_column: creationdate
    lookback_periods: 17
    partition:
      type: year
