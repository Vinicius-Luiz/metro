table:
  schema_name: dbo
  name: Votes
  target_schema_name: raw
  target_name: sqlserver_votes

source:
  type: sqlserver
  runtime: stackoverflow_sql_server_database
  chunk_size: 50000

target:
  type: local
  runtime: development_storage
  chunk_size: 200000

replication:
  mode: full_load
  partition:
    type: year
    reference_column: CreationDate
