[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metro"
version = "0.1.0"
description = "Motor de Extração, Transferência e Replicação de Objetos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vinicius Luiz" },
]
dependencies = [
    "polars>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "psycopg[binary]>=3.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
metro = "metro.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["metro*"]
